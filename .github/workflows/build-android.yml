name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - flClashBLocal
    paths:
      - .github/workflows/build-android.yml

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: flutter pub get

      # No KEYSTORE secret is configured on this fork, so the release build
      # falls back to debug signing with the `.dev` application id suffix.
      - name: Build apk
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch arm64 -v

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-android-arm64-v8a
          path: dist/*android-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
