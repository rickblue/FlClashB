name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - flClashBLocal
    paths:
      - .github/workflows/build-macos.yml

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: macos-15-intel
          - arch: arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: echo "value=$(awk '/^version:/{print $2; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: dart setup.dart macos -v

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}
          path: dist/*macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
