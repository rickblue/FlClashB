name: Build Windows x64 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - flClashBLocal
    paths:
      - .github/workflows/build-windows-x64.yml

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(awk '/^version:/{print $2; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: dart setup.dart windows -v

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ steps.version.outputs.value }}-windows-x64-installer
          path: dist/*windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 14
