name: Build Linux x64 Deb

on:
  workflow_dispatch:
  push:
    branches:
      - flClashBLocal
    paths:
      - .github/workflows/build-linux.yml

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu x64 deb
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build deb
        run: dart setup.dart linux --targets deb -v

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.8.96-linux-amd64-deb
          path: dist/*linux-amd64.deb
          if-no-files-found: error
          retention-days: 14
